name: CI

on:
  push:
    branches: [main]
    # Releases are tagged bare ("1.0.10"), not "v1.0.10" — the second pattern is
    # the one that actually fires; "v*" only covers the very first tag ever cut.
    tags: ["v*", "[0-9]*"]
  pull_request:

# Needed to create/update releases and their tags.
permissions:
  contents: write

# A newer push supersedes an in-flight one; never let two runs race to
# recreate the same rolling release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + test on BOTH architectures. Intel matters here beyond habit: the
  # Android/MTP backend links libmtp, which Homebrew only bottles for arm64 —
  # every other platform compiles it from source, so this job is what proves
  # the Intel path still works.
  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      # The codebase uses Swift 6-era syntax (`: @preconcurrency Protocol`,
      # `nonisolated(unsafe)`) that older bundled Xcodes reject.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          echo "host arch: $(uname -m)"

      # libmtp (+ libusb) back the Android/MTP filesystem; without them the
      # whole package fails to compile. arm64 gets a bottle, Intel builds from
      # source — hence the generous job timeout above.
      - name: Install libmtp
        run: brew install libmtp

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      # PRs get a release-build sanity check here; on push the package job below
      # does a release build anyway, so repeating it would just burn minutes.
      - name: Build (release)
        if: github.event_name == 'pull_request'
        run: swift build -c release

  # Package one .dmg per architecture. package_app.sh follows `uname -m`, so
  # each runner produces its own native build — they are NOT universal, because
  # a single machine can't obtain both halves of the libmtp dylib.
  package:
    name: Package (${{ matrix.arch }})
    needs: test
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      # Full history + tags: package_app.sh stamps CFBundleShortVersionString from
      # `git describe` and CFBundleVersion from the commit count, and a shallow
      # clone has neither.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install libmtp
        run: brew install libmtp

      - name: Package .dmg
        run: ./package_dmg.sh

      - name: Show the stamped version
        run: |
          plutil -p ".dist/Double Finder.app/Contents/Info.plist" \
            | grep -E "CFBundleShortVersionString|CFBundleVersion|DFGitRevision"

      # Name the artifact by architecture: the volume and the .app inside keep
      # their plain "Double Finder" names, only the download is disambiguated.
      - name: Rename for the release
        run: mv ".dist/Double Finder.dmg" ".dist/Double-Finder-${{ matrix.arch }}.dmg"

      - name: Verify the bundled libmtp matches this architecture
        run: |
          set -euo pipefail
          hdiutil attach ".dist/Double-Finder-${{ matrix.arch }}.dmg" -mountpoint /tmp/dfdmg -nobrowse -quiet
          APP="/tmp/dfdmg/Double Finder.app"
          echo "binary:  $(lipo -archs "$APP/Contents/MacOS/Double Finder")"
          echo "libmtp:  $(lipo -archs "$APP/Contents/Frameworks/libmtp.9.dylib")"
          # The app must resolve libmtp from inside the bundle, not from brew.
          otool -L "$APP/Contents/MacOS/Double Finder" | grep -q "@rpath/libmtp" \
            || { echo "libmtp is not bundled (@rpath missing)"; exit 1; }
          lipo -archs "$APP/Contents/Frameworks/libmtp.9.dylib" | grep -q "${{ matrix.arch }}" \
            || { echo "bundled libmtp does not cover ${{ matrix.arch }}"; exit 1; }
          hdiutil detach /tmp/dfdmg -quiet

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: .dist/Double-Finder-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # Both DMGs land on one release. Kept in a separate job so the two package
  # jobs never race to create/delete the same release.
  release:
    name: Publish release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the source (it only needs the artifacts),
          # so gh can't infer the repo from a git remote — pass it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist

          NOTES="Two builds, one per architecture — pick the one matching your Mac:

          | Download | For |
          |---|---|
          | \`Double-Finder-arm64.dmg\` | Apple Silicon (M1 and later) |
          | \`Double-Finder-x86_64.dmg\` | Intel Macs |

          They are separate rather than universal because the Android/MTP backend links libmtp, and Homebrew publishes it for arm64 only — the other half of a universal library can't be produced on a single machine.

          Drag **Double Finder.app** to /Applications. The build is ad-hoc signed, so on first launch right-click the app → **Open** to bypass Gatekeeper."

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # The release may already exist (cut by hand before the tag was
            # pushed) — attach the DMGs to it instead of failing.
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/*.dmg --clobber
            else
              gh release create "$TAG" \
                --title "$TAG" \
                --notes "Release \`$TAG\`.

          $NOTES" \
                dist/*.dmg
            fi
          else
            # Rolling prerelease: recreate it so both the tag and the DMGs track
            # the newest commit (delete is best-effort on the first ever run).
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes "Automated build of \`${GITHUB_SHA:0:7}\`.

          $NOTES" \
              dist/*.dmg
          fi
