version: 2
updates:
  # The project has no package-manager dependencies to track (SwiftPM pulls
  # nothing; libarchive and libmtp come from the system or Homebrew; 7-Zip is vendored source; the rest is a
  # download at package time). Only the CI actions are version-pinned here.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
